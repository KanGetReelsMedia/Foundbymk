't press alone."},{word:"Agony",ref:"Luke 22:44",scripture:"And being in an agony he prayed more earnestly.",reflection:"The garden holds our agony without rushing us. Jesus' sweat became like blood — God is not afraid of our most honest prayers.",prayer:"I bring my agony without editing it.",practice:"Journal for 5 minutes with no filter. Let it be raw."},{word:"Peace",ref:"John 14:27",scripture:"Peace I leave with you, my peace I give unto you.",reflection:"He found peace not by escaping the garden, but by surrendering in it. True peace is not the absence of olives being pressed, but presence in the pressing.",prayer:"Your peace, not mine.",practice:"Step outside tonight and look at the dark. Breathe peace."},{word:"Watchtower",ref:"Isaiah 5:2",scripture:"He planted a vineyard and built a watchtower in the midst of it.",reflection:"Every garden needs a watchtower — a place to see. Prayer is our tower. From there we see danger and beauty far off.",prayer:"Lift me to Your watchtower to see as You see.",practice:"Take a higher view today — a hill, a rooftop, a moment of perspective."},{word:"Garden",ref:"Genesis 2:8",scripture:"And the Lord God planted a garden eastward in Eden.",reflection:"God begins and ends in a garden. Eden, Gethsemane, and the garden of resurrection — He loves to meet us among growing things.",prayer:"Plant Your garden in my heart again.",practice:"Tend something alive today — water a plant, sweep a corner, make space."},{word:"Rooted",ref:"Colossians 2:7",scripture:"Rooted and built up in him, and stablished in the faith.",reflection:"Olive roots go 20 feet deep. They find water others cannot. To be rooted is to have a hidden life that drought cannot kill.",prayer:"Root me deeper than my fears.",practice:"Read one psalm slowly today, as water for your roots."},{word:"Pruned",ref:"John 15:2",scripture:"Every branch that beareth fruit, he purgeth it, that it may bring forth more fruit.",reflection:"A gardener prunes not to punish but to prepare
